// ─── LOGIN ──────────────────────────────────────────────────────
function handleLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    if (!username) { alert('Masukkan username!'); return; }
    if (!password) { alert('Masukkan password!'); return; }

    const isBandarValid = username === BANDAR_USERNAME && password === BANDAR_PASSWORD;

    let user = state.players.find(p => p.username === username && p.password === password);

    if (!user) {
        alert('❌ Username atau password salah!');
        return;
    }

    if (isBandarValid) {
        user.role = 'bandar';
        user.balance = 999999;
        user.isBandar = true;
    } else {
        user.role = 'player';
        user.isBandar = false;
    }
    user.isActive = true;
    savePlayers();

    localStorage.setItem('kyzn777_last_user', JSON.stringify({ username, password }));
    state.currentUser = user;
    renderDashboard();
}

// ─── DAFTAR ──────────────────────────────────────────────────────
function handleRegister() {
    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value.trim();
    const confirm = document.getElementById('regConfirm').value.trim();

    if (!username) { alert('Masukkan username!'); return; }
    if (!password) { alert('Buat password!'); return; }
    if (password !== confirm) { alert('❌ Password tidak cocok!'); return; }
    if (password.length < 3) { alert('❌ Password minimal 3 karakter!'); return; }

    const existing = state.players.find(p => p.username === username);
    if (existing) {
        alert('❌ Username "' + username + '" sudah terdaftar! Gunakan username lain.');
        return;
    }

    if (username === BANDAR_USERNAME) {
        alert('❌ Username ini tidak bisa didaftarkan!');
        return;
    }

    const user = {
        id: Date.now() + Math.random() * 1000,
        username: username,
        password: password,
        role: 'player',
        balance: 1000,
        bet: 0,
        isActive: true,
        isCashedOut: false,
        joinedAt: new Date().toISOString(),
        isBandar: false
    };
    state.players.push(user);
    savePlayers();

    localStorage.setItem('kyzn777_last_user', JSON.stringify({ username, password }));
    state.currentUser = user;

    alert('✅ Akun "' + username + '" berhasil dibuat! Saldo awal: 1.000');
    renderDashboard();
}

// ─── SAVE/LOAD ──────────────────────────────────────────────────
function savePlayers() {
    try { localStorage.setItem('kyzn777_players', JSON.stringify(state.players)); } catch (e) {}
}
function loadPlayers() {
    try {
        const data = localStorage.getItem('kyzn777_players');
        if (data) {
            state.players = JSON.parse(data);
            state.players.forEach(p => p.isActive = true);

}

// ─── CANVAS ──────────────────────────────────────────────────────
let canvas, ctx, W, H;
let rocketY = 0.08;
let rocketAngle = 0;
let thrustParticles = [];
let trail = [];
let starField = [];
let screenShake = 0;
let animId = null;
let glowPulse = 0;

function initCanvas() {
    const wrap = document.querySelector('.canvas-wrap');
    if (!wrap) return;
    canvas = document.getElementById('rocketCanvas');
    if (!canvas) return;
    ctx = canvas.getContext('2d');

    function resize() {
        const rect = wrap.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        W = rect.width;
        H = rect.height;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    if (starField.length === 0) {
        for (let i = 0; i < 150; i++) {
            starField.push({
                x: Math.random(),
                y: Math.random(),
                r: 0.3 + Math.random() * 2,
                a: 0.2 + Math.random() * 0.8,
                s: 0.001 + Math.random() * 0.008,
                phase: Math.random() * Math.PI * 2
            });
        }
    }

    drawCanvas();
    idleLoop();
}

function drawCanvas() {
    if (!ctx) return;
    const w = W || 600,
        h = H || 400;
    ctx.clearRect(0, 0, w, h);

    const grad = ctx.createRadialGradient(w * 0.5, h * 0.1, 0, w * 0.5, h * 0.1, h * 1.3);
    grad.addColorStop(0, '#0f0f2a');
    grad.addColorStop(0.5, '#08081a');
    grad.addColorStop(1, '#04040e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i < w; i += 35) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, h);
        ctx.stroke();
    }
    for (let i = 0; i < h; i += 35) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(w, i);
        ctx.stroke();
    }

    const time = Date.now() * 0.001;
    starField.forEach(s => {
        s.y += s.s;
        if (s.y > 1) { s.y = 0;
            s.x = Math.random(); }
        const twinkle = 0.6 + 0.4 * Math.sin(time * 0.5 + s.phase);
        ctx.globalAlpha = s.a * twinkle;
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(255,255,255,0.05)';
        ctx.shadowBlur = 3;
        ctx.beginPath();
        ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    if (trail.length > 2) {
        for (let i = 1; i < trail.length; i++) {
            const alpha = (i / trail.length) * 0.5;
            const size = 2 + (i / trail.length) * 10;
            ctx.fillStyle = `rgba(251, 191, 36, ${alpha * 0.3})`;
            ctx.shadowColor = `rgba(251, 191, 36, ${alpha * 0.05})`;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(trail[i].x * w, trail[i].y * h, size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;
    }

    thrustParticles.forEach(p => {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha * 0.9;
        ctx.fillStyle = `rgb(${p.r*255},${p.g*255},${p.b*255})`;
        ctx.shadowColor = `rgba(255, 200, 50, ${alpha * 0.2})`;
        ctx.shadowBlur = 15;
        const sz = p.size * alpha * 0.7 + 0.5;
        ctx.beginPath();
        ctx.arc(p.x * w, p.y * h, sz, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    const rx = w * 0.5;
    const ry = rocketY * h;
    const sc = Math.min(w, h) / 280;
    glowPulse = Math.sin(time * 2) * 0.5 + 0.5;

    ctx.save();
    ctx.translate(rx, ry);
    ctx.rotate(rocketAngle || 0);

    if (state.running && !state.crashed) {
        const glowSize = 40 + glowPulse * 15;
        const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize * sc);
        grd.addColorStop(0, `rgba(251, 191, 36, ${0.08 + state.multiplier * 0.005})`);
        grd.addColorStop(1, 'rgba(251, 191, 36, 0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(0, 0, glowSize * sc, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.beginPath();
    ctx.moveTo(0, -20 * sc);
    ctx.quadraticCurveTo(14 * sc, -8 * sc, 12 * sc, 6 * sc);
    ctx.quadraticCurveTo(7 * sc, 13 * sc, 0, 15 * sc);
    ctx.quadraticCurveTo(-7 * sc, 13 * sc, -12 * sc, 6 * sc);
    ctx.quadraticCurveTo(-14 * sc, -8 * sc, 0, -20 * sc);
    ctx.closePath();

    const bodyGrad = ctx.createLinearGradient(-12 * sc, 0, 12 * sc, 0);
    bodyGrad.addColorStop(0, '#b0b0d0');
    bodyGrad.addColorStop(0.2, '#f0f0ff');
    bodyGrad.addColorStop(0.5, '#ffffff');
    bodyGrad.addColorStop(0.8, '#f0f0ff');
    bodyGrad.addColorStop(1, '#a0a0c0');
    ctx.fillStyle = bodyGrad;
    ctx.shadowColor = 'rgba(255,255,255,0.03)';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, -2 * sc, 6 * sc, 0, Math.PI * 2);
    const winGrad = ctx.createRadialGradient(-1 * sc, -4 * sc, 0, 0, 0, 6 * sc);
    winGrad.addColorStop(0, '#7dd3fc');
    winGrad.addColorStop(0.5, '#38bdf8');
    winGrad.addColorStop(1, '#0284c7');
    ctx.fillStyle = winGrad;
    ctx.shadowColor = 'rgba(56, 189, 248, 0.15)';
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(-2 * sc, -5 * sc, 2.5 * sc, 3 * sc, -0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fill();

    ctx.fillStyle = '#1a1a3a';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(-12 * sc, 4 * sc);
    ctx.lineTo(-20 * sc, 11 * sc);
    ctx.lineTo(-12 * sc, 9 * sc);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(12 * sc, 4 * sc);
    ctx.lineTo(20 * sc, 11 * sc);
    ctx.lineTo(12 * sc, 9 * sc);
    ctx.closePath();
    ctx.fill();

    if (state.running && !state.crashed) {
        const flameLen = 14 + Math.random() * 12 + state.multiplier * 1.5;
        const flicker = 0.85 + Math.random() * 0.3;

        ctx.beginPath();
        ctx.moveTo(-6 * sc, 15 * sc);
        ctx.quadraticCurveTo(-10 * sc, 15 * sc + flameLen * sc * 0.6 * flicker, 0, 15 * sc + flameLen * sc * flicker);
        ctx.quadraticCurveTo(10 * sc, 15 * sc + flameLen * sc * 0.6 * flicker, 6 * sc, 15 * sc);
        ctx.closePath();

        const fGrad = ctx.createLinearGradient(0, 15 * sc, 0, 15 * sc + flameLen * sc);
        fGrad.addColorStop(0, '#f97316');
        fGrad.addColorStop(0.2, '#ef4444');
        fGrad.addColorStop(0.5, '#dc2626');
        fGrad.addColorStop(0.8, '#7f1d1d');
        fGrad.addColorStop(1, 'rgba(127, 29, 29, 0)');
        ctx.fillStyle = fGrad;
        ctx.shadowColor = '#f97316';
        ctx.shadowBlur = 50;
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(-3 * sc, 15 * sc);
        ctx.quadraticCurveTo(-5 * sc, 15 * sc + flameLen * sc * 0.3 * flicker, 0, 15 * sc + flameLen * sc * 0.6 * flicker);
        ctx.quadraticCurveTo(5 * sc, 15 * sc + flameLen * sc * 0.3 * flicker, 3 * sc, 15 * sc);
        ctx.closePath();
        ctx.fillStyle = 'rgba(251, 191, 36, 0.85)';
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 30;
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    if (state.crashed) {
        ctx.shadowBlur = 0;
        for (let i = 0; i < 12; i++) {
            const a = Math.random() * Math.PI * 2;
            const d = 10 + Math.random() * 40;
            ctx.fillStyle = `rgba(255, 200, 50, ${0.15 + Math.random() * 0.25})`;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * d * sc, Math.sin(a) * d * sc, 2 + Math.random() * 5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.fillStyle = '#f87171';
        ctx.shadowColor = '#f87171';
        ctx.shadowBlur = 20;
        for (let i = 0; i < 6; i++) {
            const a = Math.random() * Math.PI * 2;
            const d = 5 + Math.random() * 25;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * d * sc, Math.sin(a) * d * sc, 1 + Math.random() * 3, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;
    }

    ctx.restore();

    if (state.multiplier > 1.0) {
        const color = state.crashed ? '#f87171' : (state.multiplier > 5 ? '#22d3ee' : '#fbbf24');
        ctx.fillStyle = color;
        ctx.font = `bold ${Math.min(w / 11, 44)}px monospace`;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';
        ctx.shadowColor = color + '44';
        ctx.shadowBlur = 40;
        ctx.fillText(state.multiplier.toFixed(2) + 'x', w - 14, 10);
        ctx.shadowBlur = 0;
    }

    if (state.crashed) {
        ctx.fillStyle = 'rgba(248, 113, 113, 0.06)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#f87171';
        ctx.font = `bold ${Math.min(w / 8, 48)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#f87171';
        ctx.shadowBlur = 80;
        ctx.fillText('💥 CRASH', w / 2, h / 2 + 6);
        ctx.shadowBlur = 0;
    }

    if (screenShake > 0.1) {
        const sx = (Math.random() - 0.5) * screenShake * 8;
        const sy = (Math.random() - 0.5) * screenShake * 8;
        canvas.style.transform = `translate(${sx}px, ${sy}px)`;
        screenShake *= 0.93;
    } else {
        canvas.style.transform = '';
        screenShake = 0;
    }
}

function idleLoop() {
    if (!state.running && !state.crashed) {
        if (thrustParticles.length > 0) {
            thrustParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy -= 0.001;
                p.life--;
            });
            thrustParticles = thrustParticles.filter(p => p.life > 0 && p.y > 0 && p.y < 2);
        }
        drawCanvas();
    }
    requestAnimationFrame(idleLoop);
}

// ─── PLAYER ACTIONS ─────────────────────────────────────────────
function placeBet() {
    const user = state.currentUser;
    if (!user || user.role === 'bandar') return;
    if (state.running) return;

    const bet = parseInt(document.getElementById('betInput').value) || 50;
    if (bet < 10) { alert('Minimal 10'); return; }
    if (bet > user.balance) { alert('Saldo tidak cukup!'); return; }

    user.bet = bet;
    user.isCashedOut = false;
    user.balance -= bet;
    savePlayers();

    if (!state.running && !state.crashed) {
        startRound();
    }
    updateUI();
}

function cashout() {
    const user = state.currentUser;
    if (!user || user.role === 'bandar') return;
    if (!state.running || state.crashed) return;
    if (user.bet <= 0 || user.isCashedOut) return;
    if (state.multiplier < 1.05) return;

    const win = Math.round(user.bet * state.multiplier);
    user.balance += win;
    user.isCashedOut = true;
    user.bet = 0;
    savePlayers();

    state.history.push({ username: user.username, mult: state.multiplier, win: win });
    updateUI();
    renderHistory();
    document.getElementById('cashoutBtn').disabled = true;
}

function resetGame() {
    if (state.running) {
        state.running = false;
        if (animId) cancelAnimationFrame(animId);
    }
    state.crashed = false;
    state.multiplier = 1.0;
    state.round = 0;
    rocketY = 0.08;
    thrustParticles = [];
    trail = [];
    screenShake = 0;

    state.players.forEach(p => {
        if (p.role === 'player') {
            p.bet = 0;
            p.isCashedOut = false;
        }
    });
    savePlayers();

    document.getElementById('betBtn').disabled = false;
    document.getElementById('cashoutBtn').disabled = true;
    updateUI();
    drawCanvas();
}

// ─── ROUND LOGIC ───────────────────────────────────────────────
function startRound() {
    if (state.running) return;
    state.running = true;
    state.crashed = false;
    state.round++;
    state.multiplier = 1.0;
    rocketY = 0.08;
    thrustParticles = [];
    trail = [];
    screenShake = 0;

    document.getElementById('betBtn').disabled = true;
    document.getElementById('cashoutBtn').disabled = true;

    const players = state.players.filter(p => p.role === 'player' && p.isActive && p.bet > 0);
    const totalBet = players.reduce((sum, p) => sum + p.bet, 0);
    const avgBet = players.length > 0 ? totalBet / players.length : 1;

    let variance = 0;
    if (players.length > 1) {
        const avg = avgBet;
        variance = players.reduce((sum, p) => sum + Math.pow(p.bet - avg, 2), 0) / players.length;
        variance = Math.sqrt(variance) / avg;
    }

    const base = state.bandarSettings.baseMultiplier || 1.0;
    const sensitivity = state.bandarSettings.sensitivity || 1.0;
    const maxMult = state.bandarSettings.maxMultiplier || 1000;

    let crashMult = base + (totalBet / Math.max(avgBet, 1)) * sensitivity * 0.1;
    crashMult = crashMult * (1 - (variance || 0) * 0.3);
    crashMult = Math.max(crashMult, 1.1);
    crashMult = Math.min(crashMult, maxMult);

    state.crashPoint = crashMult;

    if (players.length <= 1 || totalBet === 0) {
        state.crashPoint = base + 0.5 + Math.random() * 1.5;
    }

    setStatus('🚀 <span style="color:#34d399;">Meluncur!</span> Tekan CASHOUT untuk ambil');

    let startTime = performance.now();

    function gameLoop(time) {
        if (!state.running) return;

        const elapsed = (time - startTime) / 1000;
        const rawMult = 1 + Math.min(elapsed * 0.9, 15);
        state.multiplier = rawMult;

        const progress = Math.min((state.multiplier - 1) / 5, 1);
        const eased = 1 - Math.pow(1 - progress, 1.5);
        rocketY = 0.08 + eased * 0.82;

        rocketAngle = Math.sin(time * 0.004 + state.multiplier * 0.08) * 0.025;

        trail.push({ x: 0.5, y: rocketY });
        if (trail.length > 80) trail.shift();

        emitThrust(progress, false);

        thrustParticles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy -= 0.002;
            p.life--;
        });
        thrustParticles = thrustParticles.filter(p => p.life > 0 && p.y > 0 && p.y < 2);

        screenShake = 0.15 + progress * 0.6;

        if (state.multiplier >= state.crashPoint) {
            endRound(false);
            return;
        }

        const hasActiveBet = state.players.some(p => p.role === 'player' && p.bet > 0 && !p.isCashedOut);
        if (state.multiplier >= 1.05 && hasActiveBet) {
            document.getElementById('cashoutBtn').disabled = false;
        }

        const multEl = document.getElementById('multDisplay');
        if (multEl) {
            if (state.multiplier > 5) {
                multEl.className = 'mult boost';
            } else {
                multEl.className = 'mult';
            }
        }

        updateUI();
        drawCanvas();

        animId = requestAnimationFrame(gameLoop);
    }

    animId = requestAnimationFrame(gameLoop);
}

function endRound(forceCrash) {
    state.running = false;
    state.crashed = true;

    if (animId) {
        cancelAnimationFrame(animId);
        animId = null;
    }

    const progress = Math.min((state.multiplier - 1) / 5, 1);
    rocketY = 0.08 + (1 - Math.pow(1 - progress, 1.5)) * 0.82;

    emitThrust(1, true);

    state.players.forEach(p => {
        if (p.role === 'player' && p.bet > 0 && !p.isCashedOut) {
            const partial = Math.min(state.multiplier * 0.3, 1.5);
            const win = Math.round(p.bet * partial);
            p.balance += win;
            p.bet = 0;
            p.isCashedOut = true;
            state.history.push({ username: p.username, mult: partial, win: win });
        }
    });
    savePlayers();

    setStatus(`💥 Crash di <strong>${state.multiplier.toFixed(2)}x</strong>`);
    document.getElementById('cashoutBtn').disabled = true;
    document.getElementById('betBtn').disabled = false;

    const multEl = document.getElementById('multDisplay');
    if (multEl) multEl.className = 'mult crash';

    updateUI();
    renderHistory();
    drawCanvas();

    setTimeout(() => {
        state.crashed = false;
        if (!state.running) {
            state.multiplier = 1.0;
            rocketY = 0.08;
            thrustParticles = [];
            trail = [];
            const multEl2 = document.getElementById('multDisplay');
            if (multEl2) multEl2.className = 'mult';
            updateUI();
            drawCanvas();
            setStatus('Tekan <span style="color:#34d399;">BET</span> untuk mulai');
        }
    }, 2800);
}

function forceCrash() {
    if (!state.running) return;
    state.crashPoint = state.multiplier + 0.01;
}

// ─── PARTICLES ──────────────────────────────────────────────────
function emitThrust(progress, crash) {
    const count = crash ? 80 : 12 + Math.floor(progress * 35);
    for (let i = 0; i < count; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * (crash ? 1.3 : 0.7);
        const speed = 0.5 + Math.random() * (crash ? 8 : 4.5);
        const life = 20 + Math.random() * (crash ? 65 : 40);
        const size = 2 + Math.random() * (crash ? 12 : 5);
        const r = crash ? 1 : 0.8 + Math.random() * 0.2;
        const g = crash ? 0.2 + Math.random() * 0.3 : 0.3 + Math.random() * 0.5;
        const b = crash ? 0.1 : 0.1 + Math.random() * 0.2;
        thrustParticles.push({
            x: 0.5 + (Math.random() - 0.5) * 0.06,
            y: rocketY - 0.02,
            vx: Math.cos(angle) * speed * 0.01 + (Math.random() - 0.5) * 0.01,
            vy: -Math.sin(angle) * speed * 0.01 - 0.02 + (Math.random() - 0.5) * 0.01,
            life, maxLife: life, size, r, g, b
        });
    }
    if (thrustParticles.length > 500) {
        thrustParticles.splice(0, thrustParticles.length - 500);
    }
}

// ─── UI HELPERS ──────────────────────────────────────────────────
function updateUI() {
    const multEl = document.getElementById('multDisplay');
    if (multEl) {
        multEl.textContent = state.multiplier.toFixed(2) + 'x';
        if (!state.crashed && state.multiplier > 5) {
            multEl.className = 'mult boost';
        } else if (state.crashed) {
            multEl.className = 'mult crash';
        } else {
            multEl.className = 'mult';
        }
    }
    const roundEl = document.getElementById('roundDisplay');
    if (roundEl) roundEl.textContent = state.round;

    const balEl = document.querySelector('.balance .num');
    if (balEl && state.currentUser) {
        balEl.textContent = state.currentUser.balance.toLocaleString();
    }

    const countEl = document.getElementById('playerCount');
    if (countEl) {
        const active = state.players.filter(p => p.role === 'player' && p.isActive);
        countEl.textContent = active.length;
    }
}

function setStatus(msg) {
    const el = document.getElementById('statusText');
    if (el) el.innerHTML = msg;
}

function renderHistory() {
    const container = document.getElementById('historyList');
    if (!container) return;
    const recent = state.history.slice(-20);
    if (recent.length === 0) {
        container.innerHTML = '<span style="color:#446666;font-size:12px;">Belum ada data</span>';
        return;
    }
    container.innerHTML = recent.map(h => `
        <span class="h-item ${h.win > 0 ? 'green' : 'red'}">
            ${h.username} ${h.mult.toFixed(2)}x ${h.win > 0 ? '✅' : '💥'}
        </span>
    `).join('');
}

// ─── BANDAR ACTIONS ─────────────────────────────────────────────
function sendBalance() {
    const target = document.getElementById('targetPlayer').value;
    const amount = parseInt(document.getElementById('sendAmount').value) || 1000;

    if (target === 'all') {
        state.players.forEach(p => {
            if (p.role === 'player') p.balance += amount;
        });
        alert(`✅ Saldo ${amount.toLocaleString()} dikirim ke semua pemain!`);
    } else {
        const player = state.players.find(p => p.username === target);
        if (player) {
            player.balance += amount;
            alert(`✅ Saldo ${amount.toLocaleString()} dikirim ke ${target}!`);
        } else {
            alert('❌ Pemain tidak ditemukan!');
        }
    }
    savePlayers();
    renderBandarDashboard();
}

// ─── HAPUS AKUN ──────────────────────────────────────────────────
function deleteAccount(username) {
    if (!state.currentUser || state.currentUser.role !== 'bandar') {
        alert('❌ Hanya bandar!');
        return;
    }

    const player = state.players.find(p => p.username === username && p.role === 'player');
    if (!player) {
        alert('❌ Pemain tidak ditemukan!');
        return;
    }

    if (!confirm(`⚠️ Yakin hapus akun "${username}" permanen?`)) return;

    state.players = state.players.filter(p => p.username !== username || p.role === 'bandar');
    state.history = state.history.filter(h => h.username !== username);
    savePlayers();

    alert(`✅ Akun "${username}" dihapus!`);
    renderBandarDashboard();
}

function deleteAllAccounts() {
    if (!state.currentUser || state.currentUser.role !== 'bandar') {
        alert('❌ Hanya bandar!');
        return;
    }

    const players = state.players.filter(p => p.role === 'player');
    if (players.length === 0) {
        alert('Tidak ada akun player.');
        return;
    }

    if (!confirm(`⚠️ Hapus ${players.length} akun?`)) return;
    if (!confirm(`🔄 Konfirmasi lagi?`)) return;

    state.players = state.players.filter(p => p.role === 'bandar');
    state.history = [];
    savePlayers();

    alert(`✅ ${players.length} akun dihapus!`);
    renderBandarDashboard();
}

// ─── LOGOUT ──────────────────────────────────────────────────────
function logout() {
    if (state.currentUser) {
        state.currentUser.isActive = false;
        savePlayers();
    }
    state.currentUser = null;
    state.running = false;
    if (animId) cancelAnimationFrame(animId);
    if (window.playerInterval) clearInterval(window.playerInterval);
    if (window.bandarInterval) clearInterval(window.bandarInterval);
    renderLogin();
}
